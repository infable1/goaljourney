# Release gates — a dataset release may be called `training_ready` only if every blocking gate passes.
# `gj gates` evaluates them live (review status, findings and leakage change after a release is built);
# `gj export --format sft|preference` refuses to write training files unless they pass (or --allow-draft,
# which writes clearly marked, not-for-training files).
#
# Thresholds are floors for the FIRST real training run of a ~4B navigator. They are not derived from
# experiments (none exist yet); each rationale says what the number protects against, and all of them
# should be revisited with evidence after the first pilot fine-tune.
version: "1.0"

gates:
  validation_strict:
    blocking: true
    description: Every released example passes schema + semantic lint + contrastive self-test with warnings treated as errors.
    rationale: Warnings are cheap to fix at this scale; a warning left in training data is a behaviour the model learns.

  review_all_approved:
    blocking: true
    min_approved_share: 1.0
    description: Every train/validation row has a qualified human approval of its exact content (status `approved`,
      which already includes expert sign-off for expert-tier examples and language-qualified reviewers).
    rationale: Synthetic, agent-authored data is not ground truth. 100% because a single wrong example (e.g. a wrong
      date or a gendered address) is learned as readily as a right one, and there is no downstream filter.

  findings_acknowledged:
    blocking: true
    description: Every released example that has a high-severity audit finding or open known issue was approved with
      that finding explicitly acknowledged (after an independent rating).
    rationale: Keeps reviewer independence (rate first) while guaranteeing that no known red flag was simply missed.

  known_issues_closed:
    blocking: true
    max_open_severity: low
    description: No open known issue of severity medium or high references a released example.
    rationale: Known issues are concrete, located defects; shipping them knowingly defeats the register.

  reviewer_diversity:
    blocking: true
    min_distinct_reviewers: 2
    max_share_single_reviewer: 0.8
    description: At least two reviewers approved released rows, and no single reviewer approved more than 80% of them.
    rationale: One person's blind spots become the model's. 0.8 still lets a lead reviewer carry most of the load in a
      small team; the calibration gate checks that the reviewers actually agree.

  calibration_agreement:
    blocking: true
    min_shared_items: 8
    min_decision_agreement: 0.75
    min_decision_kappa: 0.40
    description: On the calibration items (review manifest), every reviewer pair with >= 8 shared items agrees on the
      decision (approve / revise / reject) in >= 75% of items with Cohen's kappa >= 0.40.
    rationale: 75% = at most 2 disagreements in 8. Kappa 0.40 is the conventional lower bound of "moderate" agreement
      (Landis & Koch 1977). With 8 items kappa's confidence interval is wide, so this gate detects a rubric that is
      being read differently — it does not certify reliability. Raise both after the first 100 double-reviewed items.

  leakage_hard_clean:
    blocking: true
    description: No hard finding in any leakage layer (exact / near-duplicate / lexical paraphrase / scenario group / seed id)
      and the evaluation metadata is complete and valid.
    rationale: These are the only layers precise enough to block automatically; see docs/LEAKAGE_CHECKS.md.

  leakage_dispositions:
    blocking: true
    description: Every reviewed template or seed overlap has a human disposition, and no decided rewrite is still pending.
    rationale: Most real overlaps are behavioural templates that text similarity cannot see (several are cross-lingual);
      only a person can decide whether a pair is intended in-distribution testing or leakage.

  coverage_minimums:
    blocking: true
    min_approved_train: 1000
    min_per_task_type: 20
    min_language_share: {ru: 0.35, en: 0.35}
    min_mixed_input_share: 0.03
    min_non_allowed_safety_share: 0.08
    description: Enough approved examples overall, per output contract, per language and for the rare-but-critical slices.
    rationale: The Milestone-2 target is ~2,000 (configs/coverage_targets.yaml). 1,000 is half of it and is the size at which
      the smallest target share (3%) yields >= 30 examples per operation. 20 per operation is a floor below which a ~4B model
      is unlikely to follow an output contract reliably (a working assumption to validate in the pilot). Language floors
      allow ±15 points around the 50/50 target; mixed-input and non-allowed-safety floors are roughly a third of their
      targets (8% and 12%), enough to be learned but not yet at target.

  preference_minimums:
    blocking: true
    applies_to: [preference]
    min_per_failure_mode: 5
    description: For preference export only — every failure mode has at least 5 approved rejected outputs.
    rationale: With fewer, a preference pair teaches one specific wording rather than the failure mode.

  eval_readiness:
    blocking: true
    min_cases: 200
    min_cases_per_task_type: 10
    description: The evaluation set that will judge the trained model is large enough and has leakage metadata for every case.
    rationale: At n=200 and a pass rate near 0.8 the 95% interval is about ±5.5 points — enough to see a 10-point change
      overall. At 10 cases per operation it is still about ±25 points, so per-operation numbers stay indicative only;
      docs/EVALUATION_EXPANSION_PLAN.md plans the path to 300–500.

  licensing_resolved:
    blocking: true
    file: configs/licensing_status.yaml
    description: Every open licensing question is resolved and recorded.
    rationale: Training on data whose usage rights are unclear (teacher-model terms, base-model licence) creates a
      liability that cannot be removed from a trained model afterwards.
