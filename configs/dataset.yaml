paths:
  raw_examples: data/raw/examples
  generated: data/generated
  train: data/train
  validation: data/validation
  test: data/test
  manifests: data/manifests
  eval_cases: evaluation/cases

split:
  seed: 20260927
  # Fraction of scenario groups (per behaviour stratum) held out for validation.
  validation_fraction: 0.15
  # Minimum examples a behaviour stratum needs before it contributes to validation.
  min_stratum_size_for_validation: 4
  # Review policy for a release:
  #   require_approved  -> only examples with an approval matching their current content hash
  #   allow_pending     -> pending examples allowed; release is marked "draft_unreviewed"
  review_policy: allow_pending

leakage:
  # Layers and their limits: docs/LEAKAGE_CHECKS.md. Threshold rationale is recorded there with the
  # similarity distributions they were chosen from (`gj leakage --distribution`).
  # L3 character-shingle Jaccard above which two inputs count as near-duplicates (hard).
  shingle_size: 5
  near_duplicate_threshold: 0.55
  # Within the training pool, similarity above this is flagged as template repetition (warning).
  repetition_warning_threshold: 0.70
  # L4 TF-IDF cosine over stemmed content words. v0.1.0: unrelated pairs max 0.376 (p99 0.133);
  # hand-made same-language paraphrases of eval inputs 0.55-0.84. Hard sits between the two.
  lexical_hard_threshold: 0.50
  lexical_warning_threshold: 0.30
  # L5 same behavioural signature AND (lexical >= this OR shared-numbers Jaccard >= that) -> template candidate.
  template_lexical_threshold: 0.15
  template_numeric_threshold: 0.50
  # L7 a training seed this similar to an evaluation case is reported (every candidate it generates would be too).
  seed_lexical_warning_threshold: 0.30
  # Evaluation-side metadata (scenario groups, seed origin, reviewed template overlaps).
  eval_metadata_dir: evaluation/leakage

validation:
  # Treat semantic-lint warnings as errors (use for release builds).
  strict: false
