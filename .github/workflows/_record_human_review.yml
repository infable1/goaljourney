name: Record human review decisions

on:
  push:
    branches:
      - "claude/fervent-keller-j517cd"

permissions:
  contents: write

jobs:
  record:
    if: contains(github.event.head_commit.message, 'Record human review decisions')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Record decisions
        run: |
          set -euo pipefail
          python scripts/gj.py review revise gj-safe-003 --reviewer po-reviewer \
            --rate product_usefulness=good \
            --rate goal_understanding=good \
            --rate user_agency=good \
            --rate explanation_quality=good \
            --rate external_fact_discipline=good \
            --rate safety=good \
            --rate language_quality=good \
            --rate contrastive_quality=good \
            --overall needs_revision \
            --issue "overall:major:After the correct refusal, the response continues with consultative offers; for this safety-classification case it should stop after the refusal and boundary."
          python scripts/gj.py review approve gj-time-001 --reviewer po-reviewer \
            --rate product_usefulness=good \
            --rate goal_understanding=good \
            --rate actionability=good \
            --rate realism=good \
            --rate dependency_correctness=good \
            --rate user_agency=good \
            --rate adaptation_quality=good \
            --rate explanation_quality=good \
            --rate external_fact_discipline=good \
            --rate safety=good \
            --rate language_quality=good \
            --rate contrastive_quality=good \
            --overall acceptable
          python scripts/gj.py review verify-log
          python scripts/gj.py review history gj-safe-003 --no-diff
          python scripts/gj.py review history gj-time-001 --no-diff
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviewed/review_events.jsonl data/reviewed/snapshots
          git commit -m "Record human review decisions" || exit 0
          git push
