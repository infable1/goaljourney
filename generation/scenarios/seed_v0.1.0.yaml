# Scenario seeds for synthetic scale-up (v0.1.0). One scenario -> several examples along the same
# journey (all share scenario_group = id, so they never straddle train/validation).
# Topics deliberately differ from the authored examples and from the evaluation cases.
scenarios:
  - id: sc-edu-001
    domain: education
    language: ru
    input_language: ru
    goal_size: complex
    difficulty: hard
    safety_category: allowed
    persona: Ученица 10 класса, любит химию, занимается сама по вечерам после школы.
    goal_seed: Пройти на заключительный этап олимпиады по химии в этом учебном году.
    known_context: ["Школьный этап пройден", "Около 6 часов в неделю", "Есть сборники задач прошлых лет"]
    unknowns: ["Даты региональных этапов", "Есть ли наставник"]
    twists: ["В декабре из-за контрольных остаётся 2 часа в неделю", "На пробном туре провалена органика"]
    task_types: [goal_clarification, feasibility_assessment, journey_generation, route_adaptation, daily_plan]
    contrastive_failure_modes: [unnecessary_questions, unverified_current_facts, discarded_progress, ignored_available_time]
    tags: [exam, has_deadline, student]

