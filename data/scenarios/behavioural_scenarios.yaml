# Behavioural scenario registry — see docs/EVALUATION_V0.2_DESIGN.md §3 and docs/LEAKAGE_CHECKS.md.
# Generated from the authoring table and then maintained by hand; `gj leakage` validates it against schemas/behavioural_scenarios.json.
registry_version: '1.0'
dataset_version: 0.1.1
note: Behavioural scenario groups (Milestone 1.6). A scenario is the situation, the decisive condition and the decision the navigator should take; pattern = operation|trigger|condition|decision.
  Training examples reference side=train scenarios in scenario_group; evaluation cases (v0.2.0) reference side=eval scenarios. No id and no pattern may be shared
  across sides (checked by `gj leakage`). The v0.1.0 topical group of each example is kept in its topic_group field.
scenarios:
