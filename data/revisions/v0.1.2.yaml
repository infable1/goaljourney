    yet confirmed for a sub-60 finish. Classification (minor_adjustment), updated goal, preserved progress and the contrastive output are unchanged.'
  rationale: 'Product owner decision on KI-012, option A: ask for the current 7 km time before judging feasibility. A feasibility claim needs
    its facts (POL-E); the missing fact is the one question whose answer changes the plan.'
