  defect: «The December 1 date still works» asserts that a sub-60-minute 10 km fits the deadline although the user's current pace is unknown (only
    that 7 km 'feels okay').
  correction: 'The message no longer asserts the date: it asks for the current 7 km time first and makes the judgement conditional on it. facts_used
