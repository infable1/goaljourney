  policies:
  - POL-C
  defect: 'Pacing says 10 h/week for 22 weeks (220 h), but the node estimates total about 47 h and the job-search nodes have no estimates, so
    most of the weekly time is unexplained (milestone m1: 14 h of tasks in 40 h of capacity). Achievement a4 «Первое собеседование» unlocks on
    n14 «20 откликов и 3 собеседования», i.e. after the third interview.'
  correction: 'Pacing stays at 10 h/week and the milestone dates are unchanged. The capacity each week leaves after the learning tasks is planned
    as job-search time: background job-search nodes n17 (weeks 1–4, 25.5 h), n18 (weeks 5–10, 36 h) and n19 (weeks 11–15, 40.5 h) in region r4
    (now active), and estimates on the job-search nodes n16 (new, «Первое собеседование», 13.5 h), n14 (45 h) and n15 (10.5 h), each with a breakdown.
    Every milestone window is within capacity (39.5/40, 99.5/100, 149/150, 218/220 h cumulative). pacing.notes, the region description, the strategy
    summary, the message and decision_summary.impact state the split (47 h learning, portfolio and CV; 102 h background search; 69 h active search).
    a4 now unlocks on n16, the first interview.'
  rationale: 'Product owner decision on KI-008, option B: keep 10 h/week, account for the remaining weekly capacity as job-search time with inspectable
    node estimates, and attach a4 to the first interview. Pacing and node estimates must tell the same story (POL-C: hour arithmetic follows from
