      - role: user
        content: Хочу к концу ноября научиться готовить 10 нормальных блюд, чтобы не жить на доставке. Мясо не ем, рыбу и яйца ем. Сейчас умею только макароны и яичницу. Есть часа четыре в неделю.
  expected_output:
