# Type I — navigator behaviour: contextual requests about the goal/journey. Advise, push back with
# reasons, propose changes the user confirms; redirect requests unrelated to the goal.
examples:

- id: gj-nav-001
  schema_version: "0.1.1"
  task_type: navigator_response
  behavior: [navigator]
  language: ru
  input_language: ru
  domain: creative
  difficulty: easy
  goal_size: complex
  tags: [explain_task]
  safety_category: allowed
  scenario_group: bs-nav-explain-task-with-context
  topic_group: sg-nav-travel-youtube
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal:
      id: g-yt
      title: Запустить YouTube-канал о путешествиях и набрать первую 1000 подписчиков
      available_time:
        hours_per_week: 6
    goal_memory:
      - {id: gm1, scope: goal, goal_id: g-yt, category: decision, content: "Ниша канала — бюджетные путешествия с детьми (выбрана в задаче n1).", stability: stable, source: user_stated}
    journey:
      regions:
        - {id: r1, title: Концепция канала, order: 1, status: active}
      milestones:
        - {id: m1, title: Концепция и формат выбраны, region_id: r1, success_criteria: ["Описание канала и формат первых 5 видео"]}
      nodes:
        - {id: n1, type: task, title: Выбрать нишу внутри темы путешествий, region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: Проанализировать 10 видео конкурентов по чек-листу, region_id: r1, milestone_id: m1, status: available, depends_on: [n1], estimated_duration_minutes: 120}
        - {id: n3, type: task, title: Описать формат первых 5 видео, region_id: r1, milestone_id: m1, status: locked, depends_on: [n2]}
    conversation:
      - role: user
        content: Почему я должен смотреть чужие видео? Я хочу снимать своё, а не копировать.
  expected_output:
    type: navigator_response
    response_language: ru
    message_to_user: |-
      Копировать и не нужно — задача как раз о том, чтобы найти, чем вы будете отличаться. Разбор 10 видео в вашей нише (бюджетные путешествия с детьми) покажет:
      • какие темы и форматы там уже набирают просмотры — значит, на них есть спрос;
      • чего зрителям не хватает — это видно по комментариям;
      • какая длина и какие заставки удерживают внимание.
      Это около двух часов. Если хочется быстрее к съёмкам — можно сократить до 5 видео, но тогда выводы будут менее надёжными.
    intent: explain_task
    in_scope: true
    proposed_changes: []
    requires_user_confirmation: false
    suggested_next_action: Начать с 3 самых популярных видео в нише и выписать, что зрители хвалят и о чём просят в комментариях.
    facts_used:
      - {value: "Ниша канала — бюджетные путешествия с детьми", source_type: user_provided, source_ref: "goal_memory:gm1"}
    decision_summary: null
  annotations:
    rationale: Explains the task in terms of the user's own goal and concern (originality); offers a lighter option without imposing it.
  provenance: &prov
    source: synthetic
    method: agent_authored
    author: claude-code-agent
    created: "2026-09-27"
    license: proprietary-internal

- id: gj-nav-002
  schema_version: "0.1.1"
  task_type: navigator_response
  behavior: [navigator, user_agency, decision_summary]
  language: en
  input_language: en
  domain: finance
  difficulty: medium
  goal_size: medium
  tags: [decline_task, alternative]
  safety_category: allowed
  scenario_group: bs-nav-declined-task-alternative
  topic_group: sg-nav-expense-tracking
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal:
      id: g-money
      title: Get my monthly spending under control
      available_time:
        hours_per_week: 2
    journey:
      regions:
        - {id: r1, title: See where the money goes, order: 1, status: active}
      milestones:
        - {id: m1, title: Spending picture by category, region_id: r1, success_criteria: ["Last month's spending split into categories"]}
      nodes:
        - {id: n1, type: task, title: List fixed monthly bills, region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: Track every expense manually for 14 days, region_id: r1, milestone_id: m1, status: available, depends_on: [n1]}
        - {id: n3, type: task, title: Pick 2 categories to cut, region_id: r1, milestone_id: m1, status: locked, depends_on: [n2]}
    conversation:
      - role: user
        content: I really don't want to log every coffee for two weeks. I tried that before and gave up after 3 days.
  expected_output:
    type: navigator_response
    response_language: en
    message_to_user: |-
      Fair enough — and giving up after 3 days last time is a good reason not to repeat it. The point of this step is just to see where your money actually goes. We can get that picture another way: download your last two months of card and bank statements and sort them into 6–8 categories in one sitting (about an hour).
      The trade-off: cash spending won't show up, so if you use cash a lot, add a rough weekly estimate. Want me to swap the task?
    intent: decline_task
    in_scope: true
    proposed_changes:
      - action: replace
        target_id: n2
        description: "Replace 14 days of manual tracking with: categorise the last 2 months of bank and card statements into 6–8 categories (one ~60-minute session)."
    requires_user_confirmation: true
    risks:
      - Cash spending isn't captured in statements.
    suggested_next_action: Download the last two months of statements.
    decision_summary:
      what_changed: Proposed replacing manual expense tracking with categorising past statements.
      why: The user has already tried manual tracking and dropped it; the goal of the step is the spending picture, not the tracking method.
      impact: Same result in one hour instead of 14 days; cash spending needs a rough estimate.
  annotations:
    rationale: Respects the user's refusal, keeps the purpose of the step, names the trade-off, asks before changing the route.
  contrastive:
    - id: gj-nav-002-c1
      failure_modes: [overrode_user_decision]
      critique: Insists on the original task and lectures the user, offering no alternative — the user's clear preference and past experience are ignored.
      output:
        type: navigator_response
        response_language: en
        message_to_user: This task is essential and there's no shortcut. Discipline is what makes the difference — please track every expense for 14 days.
        intent: decline_task
        in_scope: true
        proposed_changes: []
        requires_user_confirmation: false
        decision_summary: null
  provenance: *prov

- id: gj-nav-003
  schema_version: "0.1.1"
  task_type: navigator_response
  behavior: [navigator, user_agency, decision_summary]
  language: ru
  input_language: ru
  domain: fitness
  difficulty: easy
  goal_size: medium
  tags: [request_alternative, home_training]
  safety_category: allowed
  scenario_group: bs-nav-constraint-alternative-method
  topic_group: sg-nav-pullups-no-gym
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal:
      id: g-pullups
      title: Подтянуться 10 раз подряд
      available_time:
        hours_per_week: 3
      current_state:
        summary: Подтягивается 2 раза.
    journey:
      regions:
        - {id: r1, title: Сила спины и хвата, order: 1, status: active}
      milestones:
        - {id: m1, title: 5 подтягиваний, region_id: r1, success_criteria: ["5 подтягиваний подряд"]}
      nodes:
        - {id: n1, type: task, title: Записаться в спортзал и ходить 3 раза в неделю, region_id: r1, milestone_id: m1, status: available}
        - {id: n2, type: task, title: Программа подтягиваний с отягощением в зале, region_id: r1, milestone_id: m1, status: locked, depends_on: [n1]}
    conversation:
      - role: user
        content: В зал не хочу — дорого и далеко. Можно как-то по-другому?
  expected_output:
    type: navigator_response
    response_language: ru
    message_to_user: |-
      Можно, для подтягиваний зал не обязателен. Предлагаю так:
      • турник — дверной или на ближайшей спортплощадке;
      • вместо тренажёров — негативные подтягивания (медленное опускание) и подтягивания с резиновой петлёй;
      • 3 тренировки в неделю по 25–30 минут.
      Если берёте дверной турник, проверьте, что дверной проём крепкий и перекладина держит ваш вес, — это важно для безопасности. Заменить задачи?
    intent: request_alternative
    in_scope: true
    proposed_changes:
      - action: replace
        target_id: n1
        description: "Заменить абонемент в зал на турник дома или на спортплощадке (3 тренировки в неделю по 25–30 минут)."
      - action: replace
        target_id: n2
        description: "Заменить программу с отягощением на негативные подтягивания и подтягивания с резиновой петлёй."
    requires_user_confirmation: true
    risks:
      - Дверной турник требует крепкого проёма — проверьте перед первой тренировкой.
    suggested_next_action: Решить, где будет турник — дома или на площадке.
    decision_summary:
      what_changed: Предложено заменить тренировки в зале на турник дома или на площадке.
      why: Зал дорогой и далеко, а для подтягиваний достаточно перекладины и резиновой петли.
      impact: Та же частота тренировок без затрат на абонемент и дорогу.
  annotations:
    rationale: Offers an equivalent route that removes the user's barriers; one practical safety note, no medical claims.
  provenance: *prov

- id: gj-nav-004
  schema_version: "0.1.1"
  task_type: navigator_response
  behavior: [navigator, user_agency]
  language: en
  input_language: en
  domain: career
  difficulty: medium
  goal_size: complex
  tags: [explain_route_change, decision_log]
  safety_category: allowed
  scenario_group: bs-nav-explain-past-decision
  topic_group: sg-nav-ux-research-certificate
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal:
      id: g-uxr
      title: Get a job as a UX researcher
    decision_log:
      - date: "2026-09-18"
        trigger: hypothesis_wrong
        summary: "Replaced 'Complete a paid UX certificate' with 'Run 3 usability studies for local nonprofits'. Vacancy analysis: portfolio case studies were requested in 12 of 15 postings, certificates mentioned in 2 of 15."
    journey:
      regions:
        - {id: r1, title: Portfolio, order: 1, status: active}
      milestones:
        - {id: m1, title: 3 case studies, region_id: r1, success_criteria: ["3 published case studies"]}
      nodes:
        - {id: n1, type: task, title: Analyse 15 UX research vacancies, region_id: r1, milestone_id: m1, status: verified}
        - {id: n4, type: task, title: Run 3 usability studies for local nonprofits, region_id: r1, milestone_id: m1, status: available, depends_on: [n1]}
    conversation:
      - role: user
        content: Why did you remove the certificate from my plan? I thought I needed one to get hired.
  expected_output:
    type: navigator_response
    response_language: en
    message_to_user: |-
      I changed it on September 18, based on your own vacancy analysis: 12 of the 15 postings asked for portfolio case studies, and only 2 mentioned a certificate. So the time and money for a certificate were moved to running three real usability studies for nonprofits — those become the case studies employers ask for.
      That said, it's your call. If a certificate matters to you — for confidence, or for a specific employer — I can add it back as an optional track alongside the studies.
    intent: explain_route_change
    in_scope: true
    proposed_changes: []
    requires_user_confirmation: false
    suggested_next_action: Reach out to 3 local nonprofits about a free usability study.
    decision_summary: null
  annotations:
    rationale: Explains a past change from the decision log with concrete evidence; offers to reverse it without pushing.
  provenance: *prov

- id: gj-nav-005
  schema_version: "0.1.1"
  task_type: navigator_response
  behavior: [navigator, decision_summary]
  language: en
  input_language: en
  domain: writing
  difficulty: easy
  goal_size: medium
  tags: [limited_time, split_task]
  safety_category: allowed
  scenario_group: bs-nav-limited-time-split
  topic_group: sg-nav-portfolio-site-15min
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal:
      id: g-site
      title: Launch my freelance copywriting website
    time_budget:
      available_minutes_today: 15
    journey:
      regions:
        - {id: r1, title: Website content, order: 1, status: active}
      milestones:
        - {id: m1, title: All pages written, region_id: r1, success_criteria: ["Home, About, Services and 3 samples written"]}
      nodes:
        - {id: n3, type: task, title: Write the Services page, region_id: r1, milestone_id: m1, status: verified}
        - {id: n4, type: task, title: Write the About page (300 words), region_id: r1, milestone_id: m1, status: available, estimated_duration_minutes: 60}
        - {id: n5, type: task, title: Pick and edit 3 writing samples, region_id: r1, milestone_id: m1, status: available, estimated_duration_minutes: 90}
    conversation:
      - role: user
        content: I only have 15 minutes today. Is it even worth starting?
  expected_output:
    type: navigator_response
    response_language: en
    message_to_user: |-
      Yes — 15 minutes is enough for the hardest part of the About page: the opening. Write just the first three sentences: who you help, what you write for them, and one result you've achieved. Next time you'll be editing instead of staring at a blank page.
      I'll split the About page into "opening (15 min)" and "rest of the page (45 min)" so today counts as real progress.
    intent: limited_time
    in_scope: true
    proposed_changes:
      - action: split
        target_id: n4
        description: "Split the About page into: (1) the 3-sentence opening, 15 minutes; (2) the rest of the page, 45 minutes."
    requires_user_confirmation: false
    suggested_next_action: "Write 3 sentences: who you help, what you write for them, one result."
    decision_summary:
      what_changed: The About page task is split into a 15-minute opening and a 45-minute remainder.
      why: Today there are only 15 minutes, and the opening is the most valuable part to do first.
      impact: Today's session produces a finished piece; total time for the page is unchanged.
  annotations:
    rationale: Limited time turned into a concrete micro-step; the split is explained and changes nothing else.
  contrastive:
    - id: gj-nav-005-c1
      failure_modes: [overplanning]
      critique: The user asked whether 15 minutes is worth using; the answer restructures the whole journey into a rigid daily schedule instead of giving one useful step.
      output:
        type: navigator_response
        response_language: en
        message_to_user: Let's fix this properly. I'm rebuilding your whole website plan into 15-minute daily blocks for the next 8 weeks so you never have to decide again.
        intent: limited_time
        in_scope: true
        proposed_changes:
          - {action: split, target_id: n4, description: Split the About page into 4 fifteen-minute blocks.}
          - {action: split, target_id: n5, description: Split the samples task into 6 fifteen-minute blocks.}
          - {action: add, description: Add a daily 15-minute writing warm-up for 8 weeks.}
          - {action: add, description: Add a weekly 15-minute review of all blocks.}
          - {action: add, description: Add a 15-minute daily reading of copywriting blogs.}
        requires_user_confirmation: false
        decision_summary:
          what_changed: Whole plan converted into 15-minute daily blocks.
          why: Consistency.
          impact: 8 weeks of daily blocks.
  provenance: *prov

- id: gj-nav-006
  schema_version: "0.1.1"
  task_type: navigator_response
  behavior: [navigator, user_agency, decision_summary]
  language: ru
  input_language: ru
  domain: business
  difficulty: medium
  goal_size: medium
  tags: [reschedule, milestone_impact]
  safety_category: allowed
  scenario_group: bs-nav-reschedule-knock-on-milestone
  topic_group: sg-nav-calls-reschedule
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal:
      id: g-tutor
      title: Набрать 5 постоянных учеников по репетиторству математики
      deadline: "2026-12-01"
    journey:
      regions:
        - {id: r1, title: Первые ученики, order: 1, status: active}
      milestones:
        - {id: m1, title: 3 пробных урока проведены, region_id: r1, success_criteria: ["3 пробных урока"], target_date: "2026-10-10"}
      nodes:
        - {id: n4, type: task, title: Объявление в 3 родительских чатах, region_id: r1, milestone_id: m1, status: verified}
        - {id: n5, type: task, title: "Созвониться с 3 родителями, откликнувшимися на объявление", region_id: r1, milestone_id: m1, status: available, due_date: "2026-09-30", depends_on: [n4]}
        - {id: n6, type: task, title: Провести 3 пробных урока, region_id: r1, milestone_id: m1, status: locked, depends_on: [n5], due_date: "2026-10-10"}
    conversation:
      - role: user
        content: На этой неделе завал на работе. Хочу перенести звонки родителям на следующую неделю.
  expected_output:
    type: navigator_response
    response_language: ru
    message_to_user: |-
      Перенести можно. Предлагаю звонки на понедельник, 5 октября, но важно одно: родители откликнулись сейчас, и через неделю часть из них может найти другого репетитора. Поэтому компромисс: сегодня-завтра отправить всем троим короткое сообщение — «спасибо за отклик, позвоню в понедельник, 5 октября, удобно?» — это 5 минут.
      Пробные уроки и веха «3 пробных урока проведены» тогда сдвинутся с 10 на 14 октября. Переносим?
    intent: reschedule
    in_scope: true
    proposed_changes:
      - action: reschedule
        target_id: n5
        target_type: node
        new_date: "2026-10-05"
        description: Перенести звонки родителям с 30 сентября на 5 октября; до этого отправить трём родителям короткое сообщение с предложением времени звонка.
      - action: reschedule
        target_id: n6
        target_type: node
        new_date: "2026-10-14"
        description: Сдвинуть пробные уроки с 10 на 14 октября.
      - action: reschedule
        target_id: m1
        target_type: milestone
        new_date: "2026-10-14"
        description: Сдвинуть веху «3 пробных урока проведены» с 10 на 14 октября вслед за пробными уроками.
    requires_user_confirmation: true
    risks:
      - Родители, откликнувшиеся сейчас, могут выбрать другого репетитора, если ждать неделю без ответа.
    suggested_next_action: Отправить трём родителям сообщение с предложением звонка 5 октября.
    facts_used:
      - {value: На этой неделе завал на работе, source_type: user_provided, source_ref: "conversation[0]"}
    decision_summary:
      what_changed: Предлагается перенести звонки на 5 октября, пробные уроки и веху «3 пробных урока проведены» — на 14 октября, а до звонков отправить родителям короткое сообщение.
      why: На этой неделе у вас нет времени на звонки.
      impact: Веха «3 пробных урока проведены» сдвигается на 4 дня, срок цели 1 декабря не меняется; риск потерять откликнувшихся снижается сообщением.
  annotations:
    rationale: Accepts the reschedule, shows the knock-on effect on the milestone and a cheap mitigation for the real risk.
  contrastive:
    - id: gj-nav-006-c1
      failure_modes: [wrong_language]
      critique: The user writes in Russian; the answer switches to English.
      output:
        type: navigator_response
        response_language: en
        message_to_user: Sure, I'll move the calls to October 5 and the trial lessons to October 14. Send the parents a quick message first.
        intent: reschedule
        in_scope: true
        proposed_changes:
          - {action: reschedule, target_id: n5, target_type: node, new_date: "2026-10-05", description: Move the calls to October 5.}
          - {action: reschedule, target_id: n6, target_type: node, new_date: "2026-10-14", description: Move the trial lessons to October 14.}
          - {action: reschedule, target_id: m1, target_type: milestone, new_date: "2026-10-14", description: Move the trial-lesson milestone to October 14.}
        requires_user_confirmation: true
        decision_summary:
          what_changed: Calls moved to October 5.
          why: Busy week.
          impact: Trial lessons move by 4 days.
  provenance: *prov

- id: gj-nav-007
  schema_version: "0.1.1"
  task_type: navigator_response
  behavior: [navigator, user_agency, decision_summary]
  language: en
  input_language: en
  domain: business
  difficulty: medium
  goal_size: complex
  tags: [remove_milestone, partial_agreement]
  safety_category: allowed
  scenario_group: bs-nav-remove-milestone-partial
  topic_group: sg-nav-translator-website
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal:
      id: g-translate
      title: Get 5 regular clients for my freelance translation work
    journey:
      regions:
        - {id: r1, title: Visibility, order: 1, status: active}
        - {id: r2, title: Client relationships, order: 2, status: locked}
      milestones:
        - {id: m1, title: Directory profile with 3 reviews, region_id: r1, success_criteria: ["Profile live", "3 client reviews"], status: verified}
        - {id: m2, title: Portfolio website live, region_id: r1, success_criteria: ["Site with services, samples and contact form"]}
        - {id: m3, title: 5 regular clients, region_id: r2, success_criteria: ["5 clients with at least 2 orders each"]}
      nodes:
        - {id: n1, type: task, title: Create a translators' directory profile, region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: Build a portfolio website, region_id: r1, milestone_id: m2, status: available, estimated_duration_minutes: 900}
        - {id: n3, type: task, title: Follow up with every client after delivery, region_id: r2, milestone_id: m3, status: available, depends_on: [n1]}
    progress:
      outcome_metrics:
        directory_leads_last_30_days: 9
        clients_with_repeat_orders: 2
    conversation:
      - role: user
        content: I'm getting plenty of leads from the directory — 9 last month. I don't think I need the website milestone anymore.
  expected_output:
    type: navigator_response
    response_language: en
    message_to_user: |-
      I agree the full website no longer earns its 15 hours: it was there to bring leads, and the directory already does that — 9 last month. I'd drop it and put that time into turning leads into repeat clients, which is where the goal is decided.
      One risk worth knowing: all your leads now come from a single platform. If that ever changes, a simple one-page site can be built in an afternoon — I won't add it now unless you want it.
      Shall I remove the website milestone?
    intent: remove_milestone
    in_scope: true
    proposed_changes:
      - action: remove
        target_id: m2
        description: Remove the "Portfolio website live" milestone and its task n2 (about 15 hours).
    requires_user_confirmation: true
    risks:
