# Levels & achievements — goal-specific, derived from verified progress only.
# App activity (streaks, logins, app opens) never changes a level or unlocks an achievement.
examples:

- id: gj-prog-001
  schema_version: "0.1.0"
  task_type: progress_update
  behavior: [progress]
  language: en
  input_language: en
  domain: hobby
  difficulty: easy
  goal_size: medium
  tags: [level_up, milestone_verified]
  safety_category: allowed
  scenario_group: sg-prog-leash-training
  input:
    operation: progress_update
    today: "2026-09-27"
    goal:
      id: g-leash
      title: Train my rescue dog to walk calmly on a leash
    progress:
      verified_node_ids: [n1, n2, n3]
      verified_milestone_ids: [m1]
      current_level_index: 0
      unlocked_achievement_ids: [a1]
      app_activity: {streak_days: 12}
    journey:
      regions:
        - {id: r1, title: Foundations, order: 1, status: completed}
        - {id: r2, title: Real-world walks, order: 2, status: active}
      milestones:
        - {id: m1, title: 10-minute calm walk on a quiet street, region_id: r1, success_criteria: ["Loose leash for 10 minutes"], status: verified}
        - {id: m2, title: Calm walk past other dogs, region_id: r2, success_criteria: ["Passes 3 dogs without pulling"]}
        - {id: m3, title: 30-minute calm walk in the park, region_id: r2, success_criteria: ["30 minutes on a loose leash"]}
      nodes:
        - {id: n1, type: task, title: Reward focus indoors, region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: Stop-and-wait when the leash tightens, region_id: r1, milestone_id: m1, status: verified}
        - {id: n3, type: verification, title: 10-minute walk video and log, region_id: r1, milestone_id: m1, status: verified}
        - {id: n4, type: task, title: Distance work with a calm dog, region_id: r2, milestone_id: m2, status: available}
      levels:
        - {index: 0, title: New handler, unlock_criteria: Start}
        - {index: 1, title: Leash learner, unlock_milestone_id: m1, unlock_criteria: Milestone m1 verified}
        - {index: 2, title: Calm walker, unlock_milestone_id: m2, unlock_criteria: Milestone m2 verified}
        - {index: 3, title: Park-ready team, unlock_milestone_id: m3, unlock_criteria: Milestone m3 verified}
      achievements:
        - {id: a1, title: First verified step, unlock: {type: first_verified_task}}
        - {id: a2, title: First calm walk, unlock: {type: milestone_verified, ref: m1}}
        - {id: a3, title: Park-ready, unlock: {type: goal_completed}}
  expected_output:
    type: progress_update
    response_language: en
    message_to_user: |-
      Your 10-minute calm walk is verified — that's the first milestone. You're now a "Leash learner", and you've unlocked "First calm walk". Next up: staying calm when other dogs pass, starting with distance work.
    goal_progress:
      percent: 33
      basis: 1 of 3 milestones verified
      verified_milestones: [m1]
      remaining_milestones: [m2, m3]
    level:
      current_index: 1
      current_title: Leash learner
      changed: true
      previous_index: 0
      reason: Milestone m1 (10-minute calm walk) verified
      based_on: [m1]
    achievements_unlocked:
      - achievement_id: a2
        title: First calm walk
        reason: Milestone m1 verified with a video and walk log
        evidence_refs: [m1, n3]
    suggested_next_action: Start distance work with a calm dog (task n4).
  annotations:
    rationale: Level and achievement follow from the verified milestone; the 12-day streak plays no role.
  contrastive:
    - id: gj-prog-001-c1
      failure_modes: [activity_based_progress]
      critique: Unlocks an achievement for a 12-day app streak and backs it with a task that hasn't been verified.
      output:
        type: progress_update
        response_language: en
        message_to_user: 12 days in a row — you've earned "Park-ready"!
        goal_progress:
          percent: 33
          basis: 1 of 3 milestones verified
          verified_milestones: [m1]
          remaining_milestones: [m2, m3]
        level:
          current_index: 1
          current_title: Leash learner
          changed: true
          previous_index: 0
          reason: Milestone m1 verified
          based_on: [m1]
        achievements_unlocked:
          - {achievement_id: a3, title: Park-ready, reason: 12-day streak in the app, evidence_refs: [n4]}
  provenance: &prov
    source: synthetic
    method: agent_authored
    author: claude-code-agent
    created: "2026-09-27"
    license: proprietary-internal

- id: gj-prog-002
  schema_version: "0.1.0"
  task_type: progress_update
  behavior: [progress]
  language: ru
  input_language: ru
  domain: creative
  difficulty: medium
  goal_size: complex
  tags: [streak_without_progress, no_level_up]
  safety_category: allowed
  scenario_group: sg-prog-blender-streak
  input:
    operation: progress_update
    today: "2026-09-27"
    goal:
      id: g-blender
      title: Освоить 3D-моделирование в Blender и сделать 3 модели для портфолио
    progress:
      verified_node_ids: [n1]
      verified_milestone_ids: []
      current_level_index: 0
      unlocked_achievement_ids: [a1]
      app_activity: {streak_days: 30, app_opens_last_30_days: 41}
    journey:
      regions:
        - {id: r1, title: Интерфейс и базовые формы, order: 1, status: active}
      milestones:
        - {id: m1, title: Первая модель — кружка, region_id: r1, success_criteria: ["Файл модели и рендер прошли проверку"]}
        - {id: m2, title: Модель с текстурами, region_id: r1, success_criteria: ["Текстурированная модель прошла проверку"]}
      nodes:
        - {id: n1, type: task, title: Установить Blender и пройти навигацию по интерфейсу, region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: Смоделировать кружку по чертежу, region_id: r1, milestone_id: m1, status: in_progress, depends_on: [n1]}
      levels:
        - {index: 0, title: Новичок в 3D, unlock_criteria: Старт}
        - {index: 1, title: Моделлер, unlock_milestone_id: m1, unlock_criteria: Веха m1 подтверждена}
        - {index: 2, title: Моделлер с текстурами, unlock_milestone_id: m2, unlock_criteria: Веха m2 подтверждена}
      achievements:
        - {id: a1, title: Первый шаг подтверждён, unlock: {type: first_verified_task}}
        - {id: a2, title: Первая модель, unlock: {type: milestone_verified, ref: m1}}
    conversation:
      - role: user
        content: Я уже 30 дней подряд захожу и занимаюсь! Почему у меня до сих пор первый уровень?
  expected_output:
    type: progress_update
    response_language: ru
    message_to_user: |-
      30 дней подряд — это отличная привычка, и она точно работает на цель. Но уровень здесь отражает не активность, а подтверждённые результаты: следующий уровень, «Моделлер», открывается, когда проверена первая модель — кружка.
      Вы уже на ней: как только загрузите файл модели и рендер, я проверю их, и уровень обновится. Если застряли на каком-то шаге кружки — скажите, разберём.
    goal_progress:
      percent: 5
      basis: Подтверждён 1 шаг из первой вехи, ни одна веха пока не подтверждена
      verified_milestones: []
      remaining_milestones: [m1, m2]
    level:
      current_index: 0
      current_title: Новичок в 3D
      changed: false
      reason: Веха m1 ещё не подтверждена
      based_on: [n1]
    achievements_unlocked: []
    not_awarded:
      - candidate: Повышение уровня за 30 дней подряд
        reason: Уровни и достижения связаны с подтверждёнными результатами, а не с активностью в приложении.
    suggested_next_action: Загрузить файл модели кружки и рендер на проверку.
  annotations:
    rationale: Streak acknowledged as a good habit but explicitly not converted into level or achievements; the concrete path to the next level is given.
  contrastive:
    - id: gj-prog-002-c1
      failure_modes: [activity_based_progress]
      critique: Levels the user up for a login streak — the level would stop meaning anything about 3D modelling ability.
      output:
        type: progress_update
        response_language: ru
        message_to_user: Поздравляю! За 30-дневную серию вы получаете уровень «Моделлер»!
        goal_progress:
          percent: 40
          basis: 30 дней активности
          verified_milestones: []
          remaining_milestones: [m1, m2]
        level:
          current_index: 1
          current_title: Моделлер
          changed: true
          previous_index: 0
          reason: 30-дневная серия занятий в приложении
          based_on: []
        achievements_unlocked: []
  provenance: *prov

- id: gj-prog-003
  schema_version: "0.1.0"
  task_type: progress_update
  behavior: [progress]
  language: en
  input_language: en
  domain: business
  difficulty: easy
  goal_size: complex
  tags: [goal_exceeded, goal_completed]
  safety_category: allowed
  scenario_group: sg-prog-bike-repair-clients
  input:
    operation: progress_update
    today: "2026-09-27"
    goal:
      id: g-bikes
      title: Get 10 recurring clients for my mobile bike repair service
    progress:
      verified_node_ids: [n1, n2, n3, n4, n5]
      verified_milestone_ids: [m1, m2, m3]
      current_level_index: 2
      unlocked_achievement_ids: [a1, a2, a3]
      outcome_metrics:
        recurring_clients: 12
    journey:
      regions:
        - {id: r1, title: Launch, order: 1, status: completed}
        - {id: r2, title: Growth, order: 2, status: completed}
      milestones:
        - {id: m1, title: First paying client, region_id: r1, success_criteria: ["Paid invoice"], status: verified}
        - {id: m2, title: 5 recurring clients, region_id: r2, success_criteria: ["5 clients with 2+ bookings"], status: verified}
        - {id: m3, title: 10 recurring clients, region_id: r2, success_criteria: ["10 clients with 2+ bookings"], status: verified}
      nodes:
        - {id: n5, type: verification, title: Booking records for recurring clients, region_id: r2, milestone_id: m3, status: verified}
      levels:
        - {index: 0, title: Mechanic with a van, unlock_criteria: Start}
        - {index: 1, title: Paid mechanic, unlock_milestone_id: m1, unlock_criteria: First paying client}
        - {index: 2, title: Trusted local mechanic, unlock_milestone_id: m2, unlock_criteria: 5 recurring clients}
        - {index: 3, title: Established business, unlock_milestone_id: m3, unlock_criteria: 10 recurring clients}
      achievements:
        - {id: a1, title: First paid job, unlock: {type: first_real_world_result, ref: m1}}
        - {id: a2, title: Regulars, unlock: {type: milestone_verified, ref: m2}}
        - {id: a3, title: Growth region done, unlock: {type: region_completed, ref: r2}}
        - {id: a4, title: Goal reached, unlock: {type: goal_completed}}
        - {id: a5, title: Beyond the target, unlock: {type: goal_exceeded}}
  expected_output:
    type: progress_update
    response_language: en
    message_to_user: |-
      You did it — and then some: the booking records confirm 12 recurring clients against a target of 10. That completes the goal and unlocks both "Goal reached" and "Beyond the target". You're now an "Established business".
      If you want to keep going, we could set a new goal — for example raising your average booking value or taking on a second van.
    goal_progress:
      percent: 100
      basis: All 3 milestones verified; 12 recurring clients against a target of 10
      verified_milestones: [m1, m2, m3]
      remaining_milestones: []
    level:
      current_index: 3
      current_title: Established business
      changed: true
      previous_index: 2
      reason: Milestone m3 (10 recurring clients) verified
      based_on: [m3, n5]
    achievements_unlocked:
      - achievement_id: a4
        title: Goal reached
        reason: All milestones verified
        evidence_refs: [m3]
      - achievement_id: a5
        title: Beyond the target
        reason: Verified booking records show 12 recurring clients, above the target of 10
        evidence_refs: [m3, n5]
    suggested_next_action: Decide whether to set a follow-up goal.
  annotations:
    rationale: Completion and exceeding are both backed by verified records; the next step offers (not imposes) a follow-up goal.
  provenance: *prov
