# Type K — available time changes (10 -> 3 h/week and 3 -> 10 h/week). Reprioritise, postpone,
# accelerate, drop low-value work, recalculate dates, explain. The user's deadline changes only with consent.
examples:

- id: gj-time-001
  schema_version: "0.1.1"
  task_type: route_adaptation
  behavior: [time_adaptation, route_adaptation, decision_summary, user_agency]
  language: en
  input_language: en
  domain: career
  difficulty: hard
  goal_size: complex
  tags: [less_time, flexible_deadline, scope_cut]
  safety_category: allowed
  scenario_group: bs-time-reduced-scope-cut-or-deadline-option
  topic_group: sg-time-dataviz-portfolio
  input:
    operation: route_adaptation
    today: "2026-09-27"
    goal:
      id: g-dataviz
      title: Build a portfolio of 3 data visualisation projects by March 1
      deadline: "2027-03-01"
      deadline_flexibility: flexible
      available_time:
        hours_per_week: 10
    time_budget:
      hours_per_week: 3
      previous_hours_per_week: 10
    journey:
      pacing: {weekly_hours_planned: 10, horizon_weeks: 22}
      regions:
        - {id: r1, title: Projects, order: 1, status: active}
        - {id: r2, title: Presentation, order: 2, status: locked}
      milestones:
        - {id: m1, title: 3 projects finished, region_id: r1, success_criteria: ["3 projects published"], target_date: "2027-02-01"}
        - {id: m2, title: Portfolio site live, region_id: r2, success_criteria: ["Site with 3 case pages"], target_date: "2027-03-01"}
      nodes:
        - {id: n1, type: task, title: "Project 1: city bike usage dashboard", region_id: r1, milestone_id: m1, status: verified, estimated_duration_minutes: 1500}
        - {id: n2, type: task, title: "Project 2: housing prices story", region_id: r1, milestone_id: m1, status: in_progress, estimated_duration_minutes: 1500}
        - {id: n3, type: task, title: Learn D3.js from scratch, region_id: r1, milestone_id: m1, status: available, estimated_duration_minutes: 1800, priority: optional}
        - {id: n4, type: task, title: "Project 3: interactive D3 climate visualisation", region_id: r1, milestone_id: m1, status: locked, depends_on: [n3], estimated_duration_minutes: 1800}
        - {id: n5, type: task, title: Write a blog post about each project, region_id: r2, milestone_id: m2, status: locked, depends_on: [n4], estimated_duration_minutes: 900, priority: optional}
        - {id: n6, type: task, title: Build the portfolio site, region_id: r2, milestone_id: m2, status: locked, depends_on: [n4], estimated_duration_minutes: 900}
    events:
      - type: less_time
        date: "2026-09-26"
        description: New job starts next week; available time drops from 10 to 3 hours per week.
    conversation:
      - role: user
        content: I got the job! But it means I'll only have about 3 hours a week for the portfolio from now on.
  expected_output:
    type: route_adaptation
    response_language: en
    message_to_user: |-
      Congratulations on the job! At 3 hours a week the unfinished part of the plan (about 115 hours) would take around 38 weeks — roughly 9 months, well past March 1 — so something has to give. My proposal:
      • drop "Learn D3 from scratch" and the blog posts — they're nice-to-haves;
      • make project 3 a smaller one in the tools you already use (about 15 hours instead of 30);
      • keep March 1 for projects 2 and 3 plus a simple one-page portfolio site (about 8 hours instead of 15).
      That leaves about 48 hours of work: about 16 weeks at 3 h/week, so roughly 6 weeks of buffer before March 1. If you'd rather keep the D3 project, the alternative is moving the deadline to early May. Which do you prefer?
    trigger:
      type: less_time
      description: Available time drops from 10 to 3 hours per week because of a new job.
    change_level: major
    requires_user_confirmation: true
    removed_nodes:
      - node_id: n3
        reason: Learning D3 from scratch (about 30 h) doesn't fit 3 h/week before March.
      - node_id: n5
        reason: Blog posts are optional; the case pages on the site cover the same story.
    added_nodes: []
    modified_nodes:
      - node_id: n4
        changes:
          - {field: title, from: "Project 3: interactive D3 climate visualisation", to: "Project 3: climate visualisation in your current tools"}
          - {field: estimated_duration_minutes, from: 1800, to: 900}
          - {field: depends_on, from: [n3], to: [n2]}
        reason: Keeps a third project within the new time budget.
      - node_id: n6
        changes:
          - {field: title, from: Build the portfolio site, to: Build a simple one-page portfolio site}
          - {field: estimated_duration_minutes, from: 900, to: 480}
        reason: A single page with three project cards is enough for applications.
    modified_deadlines: []
    new_weekly_hours_planned: 3
    workload:
      weekly_hours: 3
      remaining_minutes_before: 6900
      remaining_minutes_after: 2880
      horizon: {target: goal, target_id: g-dataviz, date: "2027-03-01"}
      weeks_needed: 16
      weeks_available: 22.1
      fits: true
    preserved_progress: [n1]
    user_options:
      - Keep March 1 with a smaller third project (recommended)
      - Keep the D3 project and move the deadline to early May
    facts_used:
      - {value: "About 3 hours a week for the portfolio from now on", source_type: user_provided, source_ref: "conversation[0]"}
      - {value: "Unfinished tasks add up to 6,900 minutes (about 115 hours)", source_type: model_inferred}
    decision_summary:
      what_changed: Proposed to drop D3 learning and the blog posts, shrink project 3 and the site, and plan 3 hours per week.
      why: The unfinished tasks add up to about 115 hours; at 3 h/week that is about 38 weeks, far past March 1.
      impact: About 48 hours remain — about 16 weeks at 3 h/week — which fits before March 1 with roughly 6 weeks to spare; project 1 stays verified, project 2 continues as is and the milestone dates do not change.
      alternatives_considered:
        - option: Keep everything and move the deadline to late June
          why_not: It would push your March 1 date back by almost four months, mostly for optional items (the D3 course and blog posts).
  annotations:
    rationale: Arithmetic shown, low-value work removed, verified progress kept, deadline kept by default with a real alternative; major scope change requires confirmation.
  contrastive:
    - id: gj-time-001-c1
      failure_modes: [ignored_available_time]
      critique: Acknowledges the new job but keeps planning 10 hours a week, so the user falls behind from week one.
      output:
        type: route_adaptation
        response_language: en
        message_to_user: Congrats! Let's keep the plan as it is — just try to squeeze in the hours on weekends.
        trigger: {type: less_time, description: New job.}
        change_level: minor
        requires_user_confirmation: false
        removed_nodes: []
        added_nodes: []
        modified_nodes:
          - node_id: n5
            changes: [{field: priority, from: optional, to: normal}]
            reason: Keep everything.
        modified_deadlines: []
        new_weekly_hours_planned: 10
        workload:
          weekly_hours: 10
          remaining_minutes_before: 6900
          remaining_minutes_after: 6900
          horizon: {target: goal, target_id: g-dataviz, date: "2027-03-01"}
          weeks_needed: 11.5
          weeks_available: 22.1
          fits: true
        preserved_progress: [n1]
        decision_summary:
          what_changed: Nothing important.
          why: The plan is good.
          impact: Work on weekends.
  provenance: &prov
    source: synthetic
    method: agent_authored
    author: claude-code-agent
    created: "2026-09-27"
    license: proprietary-internal

- id: gj-time-002
  schema_version: "0.1.1"
  task_type: route_adaptation
  behavior: [time_adaptation, route_adaptation, decision_summary]
  language: ru
  input_language: ru
  domain: programming
  difficulty: medium
  goal_size: complex
  tags: [more_time, accelerate]
  safety_category: allowed
  scenario_group: bs-time-increased-accelerate
  topic_group: sg-time-python-automation
  input:
    operation: route_adaptation
    today: "2026-09-27"
    goal:
      id: g-py-auto
      title: Выучить Python, чтобы автоматизировать рабочие отчёты
      deadline: "2027-06-30"
      available_time:
        hours_per_week: 3
    time_budget:
      hours_per_week: 10
      previous_hours_per_week: 3
    journey:
      pacing: {weekly_hours_planned: 3, horizon_weeks: 40}
      regions:
        - {id: r1, title: Основы Python, order: 1, status: active}
        - {id: r2, title: Работа с Excel и файлами, order: 2, status: locked}
        - {id: r3, title: Автоматизация отчёта, order: 3, status: locked}
      milestones:
        - {id: m1, title: Основы освоены, region_id: r1, success_criteria: ["30 задач на основы решены"], target_date: "2026-12-20"}
        - {id: m2, title: Читаю и пишу Excel из Python, region_id: r2, success_criteria: ["Скрипт собирает 3 файла в один"], target_date: "2027-03-15"}
        - {id: m3, title: Еженедельный отчёт собирается скриптом, region_id: r3, success_criteria: ["Отчёт за 3 недели подряд собран скриптом"], target_date: "2027-06-30"}
      nodes:
        - {id: n1, type: task, title: "Переменные, условия, циклы: 15 задач", region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: "Функции и списки: 15 задач", region_id: r1, milestone_id: m1, status: available, depends_on: [n1], estimated_duration_minutes: 1500}
        - {id: n3, type: task, title: Библиотека для работы с Excel-файлами, region_id: r2, milestone_id: m2, status: locked, depends_on: [n2], estimated_duration_minutes: 1500}
        - {id: n4, type: task, title: Скрипт объединения трёх файлов, region_id: r2, milestone_id: m2, status: locked, depends_on: [n3], estimated_duration_minutes: 1200}
        - {id: n5, type: task, title: Автоматизировать еженедельный отчёт, region_id: r3, milestone_id: m3, status: locked, depends_on: [n4], estimated_duration_minutes: 1800}
    events:
      - type: more_time
        date: "2026-09-26"
        description: Руководитель разрешил тратить на обучение до 10 часов в неделю в рабочее время.
    conversation:
      - role: user
        content: Начальник разрешил учиться в рабочее время — до 10 часов в неделю! Можно ускориться?
  expected_output:
    type: route_adaptation
    response_language: ru
    message_to_user: |-
      Отличные новости! Темп вырастает с 3 до 10 часов в неделю — втрое с лишним. Вместе с новым мини-проектом останется около 108 часов работы, это примерно 11 недель. Что предлагаю:
      • сдвинуть вехи раньше, но с запасом — «до 10 часов» будут не каждую неделю: основы — к 25 октября, работа с Excel — к 13 декабря, автоматизация отчёта — к 28 февраля;
      • раз учёба теперь в рабочее время, добавить небольшой проект на реальных данных вашего отдела — выгрузку данных для отчёта скриптом.
      Итоговый срок 30 июня остаётся запасом, торопить цель не нужно. Если какая-то неделя окажется загруженной, маршрут просто вернётся к прежнему темпу.
    trigger:
      type: more_time
      description: Доступное время выросло с 3 до 10 часов в неделю.
    change_level: moderate
    requires_user_confirmation: false
    removed_nodes: []
    added_nodes:
      - id: n6
        type: task
        title: Мини-проект — скрипт выгрузки данных отдела для отчёта
        region_id: r2
        milestone_id: m2
        status: locked
        detail_level: outline
        depends_on: [n3]
        estimated_duration_minutes: 480
        created_by: ai
    modified_nodes:
      - node_id: n5
        changes:
          - {field: depends_on, from: [n4], to: [n4, n6]}
        reason: Автоматизация отчёта использует скрипт выгрузки.
    modified_deadlines:
      - {target: milestone, target_id: m1, from: "2026-12-20", to: "2026-10-25", reason: "При 10 ч/нед 25 часов основ занимают около 2,5 недели; 25 октября оставляет запас", autonomy: adapt_with_summary, state: applied}
      - {target: milestone, target_id: m2, from: "2027-03-15", to: "2026-12-13", reason: "Ускорение с учётом мини-проекта; около 78 часов до вехи", autonomy: adapt_with_summary, state: applied}
      - {target: milestone, target_id: m3, from: "2027-06-30", to: "2027-02-28", reason: "Ускорение всего маршрута с запасом на загруженные недели", autonomy: adapt_with_summary, state: applied}
    new_weekly_hours_planned: 10
    workload:
      weekly_hours: 10
      remaining_minutes_before: 6000
      remaining_minutes_after: 6480
      horizon: {target: milestone, target_id: m3, date: "2027-02-28"}
      weeks_needed: 10.8
      weeks_available: 22
      fits: true
    preserved_progress: [n1]
    facts_used:
      - {value: "Руководитель разрешил учиться до 10 часов в неделю в рабочее время", source_type: user_provided, source_ref: "events[0]"}
    decision_summary:
      what_changed: "Вехи сдвинуты раньше: «Основы освоены» — на 25 октября, «Читаю и пишу Excel из Python» — на 13 декабря, «Еженедельный отчёт собирается скриптом» — на 28 февраля; добавлен мини-проект на данных отдела; темп — 10 часов в неделю."
      why: Время выросло с 3 до 10 часов в неделю, и учёба теперь проходит в рабочее время; около 108 часов работы при таком темпе занимают примерно 11 недель.
      impact: Отчёт может собираться скриптом к концу февраля вместо конца июня, с запасом на загруженные недели; срок цели 30 июня остаётся запасом.
  annotations:
    rationale: More time -> accelerate milestones and add one high-value task tied to the user's real context; the goal deadline stays untouched as buffer.
  provenance: *prov

- id: gj-time-003
  schema_version: "0.1.1"
  task_type: route_adaptation
  behavior: [time_adaptation, route_adaptation, decision_summary, user_agency]
  language: ru
  input_language: ru
  domain: certification
  difficulty: hard
  goal_size: complex
  tags: [less_time, fixed_deadline, high_yield_focus]
  safety_category: allowed
  scenario_group: bs-time-reduced-fixed-deadline-high-yield
  topic_group: sg-time-bank-attestation
  input:
    operation: route_adaptation
    today: "2026-09-27"
    goal:
      id: g-attest
      title: Сдать внутренний аттестационный экзамен на кредитного аналитика
      deadline: "2026-12-12"
      deadline_flexibility: fixed
      available_time:
        hours_per_week: 10
    time_budget:
      hours_per_week: 3
      previous_hours_per_week: 10
    journey:
      pacing: {weekly_hours_planned: 10, horizon_weeks: 11}
      regions:
        - {id: r1, title: Теория, order: 1, status: active}
        - {id: r2, title: Практика и пробные тесты, order: 2, status: locked}
      milestones:
        - {id: m1, title: Теория пройдена, region_id: r1, success_criteria: ["Все 6 разделов пройдены"], target_date: "2026-11-08"}
        - {id: m2, title: Готов к экзамену, region_id: r2, success_criteria: ["Пробный тест — 75% и выше"], target_date: "2026-12-06"}
      nodes:
        - {id: n1, type: task, title: "Раздел 1: финансовая отчётность", region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: "Раздел 2: анализ денежных потоков", region_id: r1, milestone_id: m1, status: in_progress, priority: critical, estimated_duration_minutes: 360}
        - {id: n3, type: task, title: "Раздел 3: кредитные рейтинги", region_id: r1, milestone_id: m1, status: available, priority: critical, estimated_duration_minutes: 420}
        - {id: n4, type: task, title: "Раздел 4: история банковского регулирования", region_id: r1, milestone_id: m1, status: available, priority: optional, estimated_duration_minutes: 660}
        - {id: n5, type: task, title: "Раздел 5: залоги и обеспечение", region_id: r1, milestone_id: m1, status: available, priority: high, estimated_duration_minutes: 420}
        - {id: n6, type: task, title: "Раздел 6: отраслевые обзоры", region_id: r1, milestone_id: m1, status: available, priority: optional, estimated_duration_minutes: 660}
        - {id: n7, type: task, title: Разбор 5 кейсов кредитных заявок, region_id: r2, milestone_id: m2, status: locked, depends_on: [n2, n3, n5], estimated_duration_minutes: 600}
        - {id: n8, type: verification, title: Два пробных теста, region_id: r2, milestone_id: m2, status: locked, depends_on: [n7], estimated_duration_minutes: 480}
    events:
      - type: less_time
        date: "2026-09-26"
        description: Закрытие квартала — до конца года остаётся около 3 часов в неделю.
    conversation:
      - role: user
        content: У нас закрытие квартала, до конца года смогу заниматься часа три в неделю, не больше. А экзамен 12 декабря, перенести нельзя.
  expected_output:
    type: route_adaptation
    response_language: ru
    message_to_user: |-
      Понятно: дата фиксирована, времени втрое меньше. При 3 часах в неделю до экзамена остаётся около 32 часов, а незавершённая часть плана занимает около 60 часов. Поэтому предлагаю сосредоточиться на том, что даёт больше всего баллов:
      • разделы 4 (история регулирования) и 6 (отраслевые обзоры) убрать из обязательных — они помечены как второстепенные;
      • денежные потоки, рейтинги и залоги остаются;
      • 5 кейсов сократить до 3, один пробный тест вместо двух — за неделю до экзамена.
      Тогда останется около 30 часов — впритык, но пробный тест успевает к 6 декабря, а теория — к 15 ноября вместо 8-го.
      Риск честно назову: если раздел 4 или 6 всё же будет на экзамене, там можно потерять баллы. Подтверждаете такой вариант?
    trigger:
      type: less_time
      description: Время сократилось с 10 до 3 часов в неделю при фиксированной дате экзамена.
    change_level: major
    requires_user_confirmation: true
    removed_nodes:
      - node_id: n4
        reason: Второстепенный раздел; не помещается в 3 часа в неделю до фиксированной даты.
      - node_id: n6
        reason: Второстепенный раздел; не помещается в 3 часа в неделю до фиксированной даты.
    added_nodes: []
    modified_nodes:
      - node_id: n7
        changes:
          - {field: title, from: Разбор 5 кейсов кредитных заявок, to: Разбор 3 кейсов кредитных заявок}
          - {field: estimated_duration_minutes, from: 600, to: 360}
        reason: Три кейса дают основную практику за меньшее время.
      - node_id: n8
        changes:
          - {field: title, from: Два пробных теста, to: Один пробный тест за неделю до экзамена}
          - {field: estimated_duration_minutes, from: 480, to: 240}
        reason: Экономия времени при сохранении итоговой проверки готовности.
    modified_deadlines:
      - {target: milestone, target_id: m1, from: "2026-11-08", to: "2026-11-15", reason: "Три ключевых раздела (около 20 часов) при 3 ч/нед", autonomy: adapt_with_summary, state: proposed}
    new_weekly_hours_planned: 3
    workload:
      weekly_hours: 3
      remaining_minutes_before: 3600
      remaining_minutes_after: 1800
      horizon: {target: goal, target_id: g-attest, date: "2026-12-12"}
      weeks_needed: 10
      weeks_available: 10.9
      fits: true
    preserved_progress: [n1]
    user_options:
      - Сосредоточиться на ключевых разделах (предложено)
      - Оставить все разделы и пройти их конспективно, рискуя глубиной
    facts_used:
      - {value: "До конца года — около 3 часов в неделю", source_type: user_provided, source_ref: "conversation[0]"}
      - {value: "Экзамен 12 декабря, перенести нельзя", source_type: user_provided, source_ref: "conversation[0]"}
    decision_summary:
      what_changed: Предложено убрать два второстепенных раздела, сократить кейсы и пробные тесты и сдвинуть веху «Теория пройдена» с 8 на 15 ноября; темп — 3 часа в неделю.
      why: Дату экзамена перенести нельзя, а незавершённая часть плана — около 60 часов при примерно 32 доступных.
      impact: Остаётся около 30 часов — впритык до экзамена; фокус на разделах с наибольшим весом; риск потери баллов по разделам 4 и 6 назван явно.
      alternatives_considered:
        - option: Перенести экзамен
          why_not: Дата фиксирована.
  annotations:
    rationale: Fixed deadline respected; cuts guided by stated priorities; the residual risk is named; major change requires confirmation.
  contrastive:
    - id: gj-time-003-c1
      failure_modes: [silent_route_change, ignored_deadline]
      critique: Moves the fixed exam date without asking — the user said it cannot be moved — and presents it as done.
      output:
        type: route_adaptation
        response_language: ru
        message_to_user: Экзамен перенесён на весну, так будет спокойнее.
        trigger: {type: less_time, description: Меньше времени.}
        change_level: moderate
        requires_user_confirmation: false
        removed_nodes: []
        added_nodes: []
        modified_nodes: []
        modified_deadlines:
          - {target: goal, target_id: g-attest, from: "2026-12-12", to: "2027-04-15", reason: Меньше времени., autonomy: confirm_required, state: applied}
        new_weekly_hours_planned: 3
        workload:
          weekly_hours: 3
          remaining_minutes_before: 3600
          remaining_minutes_after: 3600
          horizon: {target: goal, target_id: g-attest, date: "2027-04-15"}
          weeks_needed: 20
          weeks_available: 28.6
          fits: true
        preserved_progress: [n1]
        decision_summary:
          what_changed: Срок перенесён.
          why: Меньше времени.
          impact: Экзамен весной.
  provenance: *prov

- id: gj-time-004
  schema_version: "0.1.1"
  task_type: route_adaptation
  behavior: [time_adaptation, route_adaptation, decision_summary]
  language: en
  input_language: en
  domain: research
