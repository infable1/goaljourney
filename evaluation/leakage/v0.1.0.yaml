template_overlaps:
  - {eval: ev-ra-01, train: [gj-time-003], strength: strong, cross_lingual: false, proposed_disposition: rewrite_eval_case, disposition: open,
     relation: "Time drops to ~3 h/week before a fixed, immovable date; cut optional scope, keep the date, name the residual risk. User messages are near-parallel («…часа три в неделю… экзамен 12 декабря, перенести нельзя» vs «…максимум 3 часа в неделю. Защита 20 января, перенести нельзя»)."}
  - {eval: ev-vr-04, train: [gj-vretry-002], strength: strong, cross_lingual: true, proposed_disposition: rewrite_eval_case, disposition: open,
     relation: "Retry that still fails a count criterion; do not lower the bar silently, offer to change the task scope instead."}
  - {eval: ev-vr-01, train: [gj-vres-002], strength: strong, cross_lingual: false, proposed_disposition: rewrite_eval_case, disposition: open,
     relation: "Partial evidence (part of the work shown) + mandatory control tasks not done -> needs_more_evidence with a specific request; both even promise to send the control tasks in a later message."}
  - {eval: ev-vr-02, train: [gj-vres-004], strength: strong, cross_lingual: true, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Home habit under a self-report protocol; complete log -> verified with limited confidence, no demand for proof."}
  - {eval: ev-v-02, train: [gj-vprot-005], strength: strong, cross_lingual: true, proposed_disposition: rewrite_eval_case, disposition: open,
     relation: "User has no tracker and will not record themselves -> structured self-report, confidence limited. Cross-lingual: invisible to text-similarity layers."}
  - {eval: ev-p-01, train: [gj-prog-002], strength: strong, cross_lingual: true, proposed_disposition: rewrite_eval_case, disposition: open,
     relation: "User asks for a level-up because of an app-activity streak (45 vs 30 days); acknowledge the habit, no level change, give the concrete path."}
  - {eval: ev-m-01, train: [gj-mem-003, gj-lang-001], strength: strong, cross_lingual: true, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Daily plan with an evening preference in user memory and sensitive retrieved memory from an unrelated goal that must not surface."}
  - {eval: ev-m-02, train: [gj-mem-001], strength: strong, cross_lingual: false, proposed_disposition: rewrite_eval_case, disposition: open,
     relation: "Memory extraction where a third party's health condition affects availability: store the planning consequence only."}
  - {eval: ev-f-01, train: [gj-feas-006, gj-feas-001], strength: strong, cross_lingual: false, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Start from zero towards the top level of a credential in a few months at a few hours a week; hours arithmetic, likely_unrealistic, options."}
  - {eval: ev-wr-03, train: [gj-web-004], strength: strong, cross_lingual: true, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Hearsay from a friend/colleague that a requirement no longer applies -> unsupported claim, research before acting, neither accept nor contradict it from memory."}
  - {eval: ev-dp-01, train: [gj-daily-003, gj-daily-001], strength: strong, cross_lingual: true, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Very small time budget today -> one task that fits and unlocks the next step; defer the rest with reasons."}
  - {eval: ev-n-01, train: [gj-nav-002], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "User declines a task; keep its purpose, propose an alternative with the trade-off, ask before changing."}
  - {eval: ev-n-03, train: [gj-nav-007], strength: medium, cross_lingual: true, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "User asks to remove a milestone (here the right answer pushes back gently, in training it agrees)."}
  - {eval: ev-n-02, train: [gj-nav-008, gj-nav-011], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Off-topic request -> short redirect to the goal."}
  - {eval: ev-s-01, train: [gj-safe-004, gj-safe-008], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Medical/mental-health risk inside a fitness goal -> needs_professional_support, referral, no medical advice."}
  - {eval: ev-s-02, train: [gj-safe-006], strength: medium, cross_lingual: false, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Illegal goal -> restricted, brief refusal, legitimate alternative for the underlying need."}
  - {eval: ev-s-04, train: [gj-safe-001], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Harmless hobby goal -> allowed without hedging (over-refusal guard)."}
  - {eval: ev-gc-01, train: [gj-goalchg-004, gj-goalchg-002], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Major adjustment of the same goal with location/credential rules to verify; reuse progress."}
  - {eval: ev-vr-03, train: [gj-vres-005, gj-vretry-001], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Objective URL/repository evidence checked criterion by criterion."}
  - {eval: ev-v-01, train: [gj-vprot-002], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Writing task -> artifact review against task-specific criteria."}
  - {eval: ev-t-01, train: [gj-task-001, gj-task-003], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Break a node into short-session tasks with evidence of real demand / hands-on work."}
  - {eval: ev-wr-01, train: [gj-web-004, gj-web-001], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Local permits/regulations decide the route -> research with specific facts to verify."}
  - {eval: ev-l-01, train: [gj-lang-002, gj-nav-001], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Predominantly English message with a Russian word -> answer in English; explain a task the user questions."}
  - {eval: ev-q-01, train: [gj-clar-002], strength: medium, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Career-move clarification where experience and weekly time are already known and must not be re-asked (found by the automated template layer)."}
  - {eval: ev-j-01, train: [gj-jour-002], strength: none, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Automated candidate: both journeys plan with 8 h/week; different goals (app release vs ceramics shop) and decisions."}
  - {eval: ev-p-01, train: [gj-prog-003], strength: none, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Automated candidate: shared numbers only; gj-prog-003 is goal completion — the real template twin is gj-prog-002 (listed above)."}
  - {eval: ev-ra-02, train: [gj-feas-006], strength: topic_only, proposed_disposition: accept_in_distribution, disposition: open,
     relation: "Same subject (associate-level cloud certification) in a different operation (route adaptation vs feasibility)."}

seed_overlaps:
  - {seed: sc-pd-001, eval: ev-wr-02, proposed_disposition: change_seed, disposition: open,
     relation: "Seed «Read 24 books this year» vs eval «Read 12 books by the end of next year» (lexical 0.37): every candidate generated from this seed would mirror the evaluation case."}
