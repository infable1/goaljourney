# Evaluation leakage metadata — eval v0.1.0 (read by `gj leakage` and the release gates).
#
# Kept outside evaluation/cases/ so that adding provenance does not change released test data.
#
# cases: scenario_group / behavior_template / seed_origin for every evaluation case. None of the 30
#   cases was derived from a scenario seed; all were written by the same agent that wrote the training
#   examples, in the same session — so they are NOT independent of the training data in authorship
#   or style, only in their concrete situations. See docs/EVALUATION_EXPANSION_PLAN.md.
#
# template_overlaps: evaluation cases whose underlying behavioural scenario closely mirrors a training
#   example (same decision structure, different surface). Text-similarity layers cannot detect most of
#   these (several are cross-lingual). Each needs a human disposition before any training-readiness
#   claim; `proposed_disposition` is the agent's suggestion, `disposition` stays `open` until a
#   reviewer decides (set decided_by to your reviewer id).
#     strong  same decision structure AND same key numbers/constraints (e.g. 3 h/week + fixed date)
#     medium  same decision structure, clearly different situation
#     topic_only  same subject matter, different operation/decision
#     none    flagged by the automated template layer, reviewed: shared numbers/signature are coincidental
eval_version: "0.1.0"
cases:
  ev-q-01: {scenario_group: sg-ev-freelance-first-client, behavior_template: bt-clarify-known-context-no-reask, seed_origin: independent_authored, author: claude-code-agent}
