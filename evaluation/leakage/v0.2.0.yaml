notes: 'Review method: every v0.2.0 case and step was read against all 92 training scenarios (decision pattern and the example
  behind it) by the case author, and every automated template/decision-pattern candidate was checked. During that review three
  atomic cases that repeated a training decision pattern almost exactly (e2-clar-01, e2-feas-01, e2-mem-01) and five whose
  topic repeated a training example or seed (e2-comp-02, e2-safe-01, e2-vprot-03, e2-route-04, e2-nav-02) were rewritten before
  release. The list below is what remains. Most units test a trained behaviour under a different decisive condition (medium);
  the strong ones are set-up or intermediate steps of multi-step cases. The case author is not independent of the training
  data (same agent, same session), so this review is a proposal: every entry needs a human disposition.'
