# Evaluation cases v0.1.0 — navigator behaviour, goal change, web research, safety, memory, progress, language.
cases:

- id: ev-n-01
  eval_version: "0.1.0"
  title: User refuses cold calls — alternative, not a lecture
  dimensions: [user_agency, planning_quality]
  task_type: navigator_response
  language: en
  input_language: en
  domain: business
  safety_category: allowed
  input:
    operation: navigator_response
    today: "2026-09-27"
    goal: {id: g-saas, title: Get 10 paying customers for my scheduling SaaS for dental clinics}
    journey:
      regions:
        - {id: r1, title: First customers, order: 1, status: active}
      milestones:
        - {id: m1, title: 10 demos booked, region_id: r1, success_criteria: ["10 demos booked with clinic owners"]}
      nodes:
        - {id: n1, type: task, title: List of 60 local dental clinics, region_id: r1, milestone_id: m1, status: verified}
        - {id: n2, type: task, title: Cold-call 30 clinics from the list, region_id: r1, milestone_id: m1, status: available, depends_on: [n1]}
        - {id: n3, type: task, title: Run 10 demos, region_id: r1, milestone_id: m1, status: locked, depends_on: [n2]}
    conversation:
      - role: user
        content: I really can't bring myself to cold call. Is there another way to get these demos?
  checks:
    - {check: schema_valid, metric: schema_validity}
    - {check: semantic_clean, metric: semantic_validity}
    - {check: equals, metric: scope_adherence, path: in_scope, value: true}
    - {check: count_min, metric: user_agency_compliance, path: proposed_changes, min: 1}
    - {check: equals, metric: user_agency_compliance, path: requires_user_confirmation, value: true}
    - {check: lint_absent, metric: decision_transparency, codes: [NAV_SILENT_CHANGE, NAV_DECLINE_NO_OPTIONS]}
  human_review_focus:
    - Offers a realistic channel (e.g. personalised emails, visits, referrals) and names the trade-off
    - Reuses the verified clinic list
  reference_output:
    type: navigator_response
    response_language: en
    message_to_user: |-
      Totally fine — cold calling isn't the only way to get demos. You already have a list of 60 clinics, so here's an alternative: send short personalised emails to 30 clinic owners (one line about a scheduling problem they likely have and a 15-minute demo offer), then follow up once after four days. It's slower to get replies than a call, so we'd send to all 30 in the first week.
      Want me to swap the calls for the email sequence?
    intent: decline_task
    in_scope: true
    proposed_changes:
      - {action: replace, target_id: n2, description: "Replace cold calls with a personalised email to 30 clinics from the list plus one follow-up after four days."}
    requires_user_confirmation: true
    risks: ["Email reply rates are usually lower than calls, so more clinics may be needed."]
    suggested_next_action: Draft the first email for one clinic.
    decision_summary:
      what_changed: Proposed replacing cold calls with personalised emails and a follow-up.
      why: You don't want to cold call; the goal of the step is booking demos, not calling.
      impact: Same clinic list; demos may take a week longer to book.

