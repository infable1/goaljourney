    conversation:
      - role: user
        content: I can only record on Sunday mornings, that's the one quiet slot in my week. My budget for a microphone is 150.
      - role: assistant
        content: Noted — Sunday mornings and a 150 budget for the mic. Anything else that affects the schedule?
      - role: user
        content: My co-host Sam has been struggling with anxiety lately, so sometimes we have to skip a recording.
