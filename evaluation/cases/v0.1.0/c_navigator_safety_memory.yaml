      - {scope: goal, goal_id: g-podcast, category: constraint, content: Microphone budget is 150., stability: stable, sensitive: false, source: user_stated}
      - {scope: goal, goal_id: g-podcast, category: constraint, content: Recordings are occasionally skipped because the co-host is unavailable; plan buffer episodes., stability: stable, sensitive: false, source: user_stated}
    not_stored:
      - {content: "The co-host's personal health situation", reason: third_party_information}

