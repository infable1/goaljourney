    progress:
      verified_node_ids: []
      verified_milestone_ids: []
      current_level_index: 0
      unlocked_achievement_ids: []
      app_activity: {streak_days: 45, app_opens_last_30_days: 60}
    journey:
      regions:
        - {id: r1, title: Techniques, order: 1, status: active}
      milestones:
        - {id: m1, title: Wet-on-wet sky studies, region_id: r1, success_criteria: ["5 sky studies reviewed"]}
      nodes:
        - {id: n1, type: task, title: 5 wet-on-wet sky studies, region_id: r1, milestone_id: m1, status: in_progress}
