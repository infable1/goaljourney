        - At least 4 of 5 correct
        confidence_ceiling: high
        self_report_only: false
        rationale: Answers to a fresh test show understanding directly.
    conversation:
    - role: assistant
      content: 'Five quick questions on window functions — answer in one message:

        1) Which function gives 1, 2, 2, 4 for tied values?

        2) Which gives 1, 2, 2, 3?

        3) How do you compute a running total of amount by date?

        4) What is the difference between ROWS and RANGE frames?

        5) How do you get the previous row''s value?'
    evidence:
    - id: e1
      type: answers
      responds_to: knowledge_test
      content: 1) RANK() 2) DENSE_RANK() 3) SUM(amount) OVER (ORDER BY date) 4) They are the same, RANGE is just older syntax.
        5) LAG(col) OVER (ORDER BY date)
