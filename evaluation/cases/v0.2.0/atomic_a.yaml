    today: '2026-10-14'
    goal:
      title: Pass the Grade 8 piano exam in four months
      available_time:
        hours_per_week: 3
      current_state:
        summary: Plays at about Grade 3 level
    conversation:
    - role: user
      content: I play at roughly Grade 3 level and want to pass Grade 8 in four months. I can practise 3 hours a week. Please
        don't tell me to aim for Grade 5 instead — I've heard that before. Is it doable?
  checks:
  - check: schema_valid
    metric: schema_validity
  - check: semantic_clean
    metric: semantic_validity
  - check: language
    metric: language_match
    value: en
  - check: equals
