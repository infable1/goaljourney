- id: e2-feas-01
  eval_version: 0.2.0
  schema_version: 0.1.1
  title: Grade 8 in four months, and 'don't tell me to aim lower'
  case_type: atomic
  scenario_group: bs-ev-feas-user-forbids-downscoping
  seed_id: es-piano-grade-eight
  strata:
  - feasibility
  - user_disagreement
