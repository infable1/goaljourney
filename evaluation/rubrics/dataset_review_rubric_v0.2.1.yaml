# Dataset review rubric v0.2.1 — human review of TRAINING examples (gj review ...).
# 0.2.1 (2026-09-29): clarifies the safety (M) anchor for `restricted` goals after the calibration
# disagreement on rv-0.1.0-02; see `safety.clarifications`. Criteria, applicability, hard gates, ratings
# and decision rules are unchanged. v0.2.0 is kept unchanged in dataset_review_rubric.yaml because
# earlier review events are stamped with rubric_version 0.2.0.
# Supersedes dataset_quality_rubric.yaml (v0.1.0, numeric 1–4), which is kept only because legacy
# review records reference it.
#
# Every applicable criterion gets a categorical rating, and the example gets an overall verdict.
# There is deliberately no summed or averaged score: a single "unacceptable" on safety is not
# compensated by excellent writing elsewhere.
#
# The test for every rating: "Would we be comfortable teaching a model this behaviour?"
version: "0.2.1"

ratings:
  good: No issue that matters for training. The model should learn exactly this.
  minor_issues: Small wording/detail issues; the behaviour taught is still right. Note them.
  major_issues: Would teach a wrong or weak behaviour in this respect. Must be fixed before training.
  unacceptable: Wrong, harmful or misleading in this respect. Reject or rewrite from scratch.
  not_applicable: The criterion does not apply to this example.

overall:
  excellent: A model trained on this learns the intended behaviour; nothing to change.
  acceptable: Right behaviour; only minor issues, recorded in notes. Fine to train on.
  needs_revision: Right idea, but at least one major issue. Fix, then review again.
  incorrect: Teaches the wrong behaviour or is unsafe. Reject (or rewrite as a new example).

decision_rules:
  approve:
    overall: [excellent, acceptable]
    forbidden_ratings: [major_issues, unacceptable]
    hard_gates_must_be: [good, not_applicable]   # minor issues are not tolerated on hard gates
    all_applicable_rated: true
  revise:
    overall: [needs_revision, acceptable, excellent]   # a reviewer may ask for a fix even on a decent example
    requires: at least one issue (criterion, severity, description) or a note
  reject:
    overall: [incorrect, needs_revision]
    requires: a note explaining why the example cannot be fixed in place
  consistency:
    - "overall 'incorrect' cannot be approved or revised; reject it"
    - "any 'unacceptable' rating forces overall 'incorrect' or 'needs_revision'"
    - "'excellent' is not allowed together with any 'major_issues' or 'unacceptable'"

# applies_to: "all" | list of task types | list of conditions:
#   has_user_text     output has user-facing text (message_to_user, questions, decision summary …)
#   asks_questions    output asks the user anything (questions list or '?' in message_to_user)
#   proposes_changes  output proposes or applies route/goal changes
#   has_contrastive   the example carries rejected outputs
#   has_memory        input has user/retrieved memory, or the operation extracts memory
# automation: how much of the criterion automated checks cover —
#   auto    fully decided by `gj validate` (reviewers still confirm, but disagreements are bugs in rules)
#   partial heuristics flag candidates (`gj audit`); a person decides
#   human   needs human judgement
#   expert  needs a domain expert when the example is in the expert tier
criteria:
  product_usefulness:
    code: A
    question: Would this output genuinely help a real user of GoalJourney at this moment?
    applies_to: all
    automation: human
    anchors:
      good: Moves the user towards the goal; a user would be glad to receive it.
      minor_issues: Helpful, but something small is missing or redundant.
      major_issues: Technically correct but not what the user needs now (wrong focus, too generic).
      unacceptable: Useless or counter-productive for the user.
  goal_understanding:
    code: B
    question: Does the output understand the real goal, context and constraints — without inventing any?
    applies_to: all
    automation: partial
    automated_support: [must_not_mention lint, retrieved-memory leak heuristic]
    anchors:
      good: Uses every relevant known fact; invents nothing about the user.
      minor_issues: Misses a minor detail that does not change the plan.
      major_issues: Ignores a stated constraint or assumes user facts that were never given.
      unacceptable: Misreads the goal, or builds on invented user facts.
  question_minimality:
    code: C
    question: Are only necessary questions asked — and the critical ones not skipped?
    applies_to: [goal_clarification, asks_questions]
    automation: partial
    automated_support: [asked_known_information lint, critical-target checks, question-count heuristic]
    anchors:
      good: Every question changes the route; nothing known is re-asked; nothing critical is missing.
      minor_issues: One question is marginal, or phrasing is heavier than needed.
      major_issues: Re-asks known facts, asks a questionnaire, or skips a question the plan depends on.
      unacceptable: Interrogates the user or plans on a critical unknown as if it were known.
  actionability:
    code: D
    question: Can the user act immediately — concrete actions, observable results, a clear next step?
    applies_to: [journey_generation, task_generation, daily_plan, navigator_response, route_adaptation,
                 verification_result, goal_change, feasibility_assessment]
    automation: partial
    automated_support: [vague-title and measurability heuristics (full tasks linted; outline titles audited)]
    anchors:
      good: Every task/next step has an object, a quantity or artefact, and can start today.
      minor_issues: One step could be more specific.
      major_issues: Several generic steps ("learn X", "research Y", "practice").
      unacceptable: The user would not know what to do next.
  realism:
    code: E
    question: Are durations, pacing, dates and arithmetic credible for this person's time, money and constraints?
    applies_to: [feasibility_assessment, journey_generation, task_generation, route_adaptation, daily_plan,
                 goal_change, navigator_response]
    automation: partial
    automated_support: [daily time-budget lint, pacing/capacity heuristic, weekday/date consistency heuristic]
    anchors:
      good: Numbers add up; dates and weekdays are right; the workload fits the stated time.
      minor_issues: Slightly optimistic but still workable.
      major_issues: Arithmetic or dates are wrong, or the workload clearly exceeds the time available.
      unacceptable: Impossible plan or dates.
  dependency_correctness:
    code: F
    question: Do dependencies reflect genuine prerequisites in a sensible order?
    applies_to: [journey_generation, task_generation, route_adaptation, daily_plan]
    automation: partial
    automated_support: [DAG/cycle and unknown-reference lint, locked/available consistency lint]
    anchors:
      good: Each dependency is a real prerequisite; nothing is blocked artificially; parallel work stays parallel.
      minor_issues: One artificial or missing dependency with little cost.
      major_issues: Order would waste the user's effort or unlock work before its prerequisite.
      unacceptable: Structurally broken ordering.
  verification_quality:
    code: G
    question: Does the verification method fit the task's nature, and does the confidence match the evidence class?
    applies_to: [verification_protocol_design, task_generation, journey_generation]
    automation: partial
    automated_support: [photo-only lint, self-report ceiling lint, nature/method lint, user-entered-data heuristic,
                        capability-assumption heuristic]
    anchors:
      good: Method proves the result for this kind of task; photos only in combination; self-report labelled limited;
            nothing intrusive; only capabilities the product actually has.
      minor_issues: Workable, but a better or lighter method exists.
      major_issues: Generic "tell me what you did" where proof is possible, user-entered data treated as objective,
                    or relies on product capabilities that may not exist.
      unacceptable: Photo-only proof, impossible or intrusive demands.
  evidence_interpretation:
    code: H
    question: Is the verification decision exactly what the submitted evidence supports?
    applies_to: [verification_result]
    automation: partial
    automated_support: [status/criteria consistency lint, confidence-vs-evidence lint]
    anchors:
      good: Each criterion judged against specific evidence; insufficient evidence -> specific request, not rejection.
      minor_issues: Correct status, slightly loose criterion notes.
      major_issues: Verifies on weak evidence, rejects without contrary evidence, or asks for unreasonable proof.
      unacceptable: The decision contradicts the evidence.
  user_agency:
    code: I
    question: Does the navigator advise without taking control of the user's goal?
    applies_to: [feasibility_assessment, route_adaptation, navigator_response, goal_change, verification_result,
                 safety_classification, proposes_changes]
    automation: partial
    automated_support: [silent-major-change lint, deadline-change-without-consent heuristic, applied-vs-proposed heuristic]
    anchors:
      good: Explains, offers options, asks before significant changes, respects the user's decision.
      minor_issues: Slightly directive tone, but the user stays in control.
      major_issues: Makes a significant change (scope, deadline, removal) without asking, or pressures the user.
      unacceptable: Overrides the user's explicit decision or blocks them without justification.
  adaptation_quality:
    code: J
    question: When the route changes, is the change proportionate, and is completed progress preserved?
    applies_to: [route_adaptation, goal_change, proposes_changes]
    automation: partial
    automated_support: [discarded-progress lint, preserved-node checks]
    anchors:
      good: Changes only what needs changing; completed work kept and reused; knock-on effects stated.
      minor_issues: Slightly more change than needed.
      major_issues: Rebuilds too much, loses progress, or misses a knock-on effect on dates/milestones.
      unacceptable: Discards verified progress or restarts without reason.
  explanation_quality:
    code: K
    question: Is the reasoning shown to the user short, honest and specific (what changed, why, impact)?
    applies_to: [has_user_text]
    automation: partial
    automated_support: [exposed-reasoning lint, decision_summary presence lint]
    anchors:
      good: Brief, specific, no hidden chain-of-thought, no filler, no overclaiming.
      minor_issues: A little long or generic in places.
      major_issues: Vague ("to improve results"), misleading, or overclaims ("exactly what hiring managers look for").
      unacceptable: Exposes internal reasoning or explains a decision it did not make.
  external_fact_discipline:
    code: L
    question: Are current external facts (laws, prices, dates, requirements, statistics) only asserted from provided research, and otherwise marked for verification?
    applies_to: all
    hard_gate: true
    automation: partial
    automated_support: [claim/source lint, unsupported-generalisation heuristic, novel-number heuristic]
    anchors:
      good: Nothing current or location-specific is asserted without a provided source; generalisations are safe and hedged.
      minor_issues: Not allowed on a hard gate — rate major_issues if anything is asserted without support.
      major_issues: An unsupported factual claim or confident generalisation that could be wrong.
      unacceptable: Invented facts, sources or availability presented as true.
  safety:
    code: M
    question: Is the behaviour right for the goal's risk level (category, role, referral, no over-refusal)?
    applies_to: all
    hard_gate: true
    automation: expert
    automated_support: [professional-authority lint, category/role consistency lint]
    anchors:
      good: Correct category and role; referral when needed, not when not; no prescriptions; harmless goals not hedged.
      minor_issues: Not allowed on a hard gate — rate major_issues if the safety behaviour needs any change.
      major_issues: Wrong urgency, missing or unnecessary referral, over-hedging, a borderline claim.
      unacceptable: Helps with harm, poses as a professional, or refuses a harmless goal.
    clarifications:
      # Added in 0.2.1. Applies to goals whose correct category is `restricted` (role `declined`).
      - The refusal must stop planning, optimising or otherwise advancing the prohibited activity.
      - The response may still offer a lawful or safe alternative, a safer reframing, or a next step for that
        alternative.
      - Offering that alternative is not unsafe continuation unless it materially facilitates the prohibited
        activity.
      - "`proceed_with_journey: false` refers to the original restricted goal, not to offering a separately
        chosen safe goal."
  language_quality:
    code: N
    question: Is the user-facing text natural and correct in the user's language — and gender-neutral about the user and the assistant?
    applies_to: [has_user_text]
    automation: partial
    automated_support: [language-match lint, Russian gendered-form heuristics, pronoun heuristic]
    anchors:
      good: Natural, idiomatic, correct register; no gendered assumptions about the user; the assistant never
            refers to itself in a gendered form (e.g. no "я проверил"/"разбил").
      minor_issues: Slightly awkward or translated-sounding, but correct.
      major_issues: Gendered address or self-reference, wrong register, or clearly unnatural text.
      unacceptable: Wrong language or hard to understand.
  contrastive_quality:
    code: P
    question: Is each rejected output a realistic mistake, clearly worse, and exactly the tagged failure(s)?
    applies_to: [has_contrastive]
    automation: partial
    automated_support: [contrastive self-test (auto-detectable failure modes must be caught by lint)]
    anchors:
      good: Plausible model mistakes; tags precise; no untagged extra defects.
      minor_issues: One output is a bit of a strawman or carries a small untagged defect.
      major_issues: Mislabelled, not actually worse, or mixes several untagged failures.
      unacceptable: The "rejected" output is actually acceptable, or the tags are wrong.
  privacy_and_memory:
    code: Q
    question: Is memory stored in the right layer, without third-party or unnecessary sensitive data, and is unrelated memory kept out of the answer?
    applies_to: [memory_extraction, has_memory]
    automation: partial
    automated_support: [third-party lint, must_not_mention lint, retrieved-memory leak heuristic]
    anchors:
      good: Right layer; nothing about third parties; unrelated memory never surfaces.
      minor_issues: A borderline item (e.g. sensitivity flag debatable).
      major_issues: Stores unnecessary sensitive data or uses memory from another goal.
      unacceptable: Leaks sensitive memory into an unrelated answer or stores third-party health data.

# Supplementary criteria P and Q extend the brief's A–N: P because rejected outputs become preference
# pairs, Q because memory isolation is a core product rule that A–N do not cover explicitly.
overall_code: O
